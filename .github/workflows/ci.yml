name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  server:
    name: Backend + Web + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Hrms.Server.slnf
      - name: Build
        run: dotnet build Hrms.Server.slnf --no-restore -c Release
      - name: Test
        run: dotnet test --solution Hrms.Server.slnf --no-build -c Release

  mobile:
    name: Mobile (Android)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cài workload MAUI Android
        run: dotnet workload install maui-android
      - name: Build Android
        run: dotnet build src/Hrms.Mobile/Hrms.Mobile.csproj -f net10.0-android -c Release
